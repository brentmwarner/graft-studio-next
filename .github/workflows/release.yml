name: Graft Production Release

# Install in brentmwarner/graft-studio as graft-next-release.yml to reuse its
# Apple and Blob secrets. It always builds an exact graft-studio-next SHA.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build native artifacts or promote previously verified artifacts
        type: choice
        options: [build, promote]
        default: build
        required: true
      source_commit:
        description: Full graft-studio-next commit SHA from its main branch
        type: string
        required: true
      version:
        description: Stable version, matching apps/desktop/package.json
        type: string
        required: true
      sign_artifacts:
        description: Sign macOS/Windows builds using production identities
        type: boolean
        default: true
      build_run_id:
        description: Successful signed build run to promote, in this repository
        type: string
        required: false
      evidence_run_id:
        description: Successful native upgrade run containing graft-upgrade-evidence artifact
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: graft-production-blob-release
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      lockfile: ${{ steps.meta.outputs.lockfile }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: brentmwarner/graft-studio-next
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require source from graft-studio-next main
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [[ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]]; then
            echo "source_commit must be the exact checked-out 40-character graft-studio-next SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main; then
            echo "Production builds may only use source already merged into graft-studio-next/main." >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - id: meta
        name: Resolve exact source and version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
        run: node scripts/graft-release-source.ts
      - uses: ./.github/actions/setup-workspace
        if: inputs.operation == 'build'
      - name: Verify release source
        if: inputs.operation == 'build'
        run: |
          bun run fmt:check
          bun run lint
          bun run typecheck
          bun run brand:check
          bun run windows-runtime:check
          bun run migrations:check
          bun run test

  build:
    if: inputs.operation == 'build'
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: mac, arch: arm64, target: dmg, runner: macos-14 }
          - { platform: mac, arch: x64, target: dmg, runner: macos-15-intel }
          - { platform: win, arch: x64, target: nsis, runner: windows-2022 }
          # Match the oldest supported Linux build baseline; newer runners raise glibc requirements.
          - { platform: linux, arch: x64, target: AppImage, runner: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v6
        with:
          repository: brentmwarner/graft-studio-next
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          electron: "true"
      - name: Restore exact release source after dependency setup
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          git reset --hard "$SOURCE_COMMIT"
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Linux native runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xvfb libgbm1 libasound2
      - name: Build native package
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          LOCKFILE_SHA256: ${{ needs.source.outputs.lockfile }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          SIGN_ARTIFACTS: ${{ inputs.sign_artifacts }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          AZURE_TENANT_ID: ${{ matrix.platform == 'win' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.platform == 'win' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.platform == 'win' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME || '' }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME || '' }}
          AZURE_TRUSTED_SIGNING_SUBJECT_DN: ${{ matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_SUBJECT_DN || '' }}
        run: node scripts/build-graft-release.ts
      - name: Verify native startup
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: node scripts/verify-packaged-desktop-startup.ts --assets-dir release-publish --platform "$PLATFORM" --arch "$ARCH" --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          retention-days: 30

  promote:
    if: inputs.operation == 'promote'
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          repository: brentmwarner/graft-studio-next
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Verify artifact run identities
        uses: actions/github-script@v8
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        with:
          script: |
            const { data: promotion } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            const { data: evidenceWorkflow } = await github.rest.actions.getWorkflow({
              ...context.repo,
              workflow_id: 'graft-next-upgrade-evidence.yml',
            });
            for (const [kind, id] of Object.entries({ build: process.env.BUILD_RUN_ID, evidence: process.env.EVIDENCE_RUN_ID })) {
              if (!/^\d+$/.test(id || '')) throw new Error(`A successful ${kind} run ID is required.`);
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(id) });
              if (run.status !== 'completed' || run.conclusion !== 'success') throw new Error(`${kind} run has not succeeded.`);
              if (kind === 'build' && (run.workflow_id !== promotion.workflow_id || run.event !== 'workflow_dispatch')) {
                throw new Error('Build artifacts must come from the manual Graft production build workflow.');
              }
              if (kind === 'evidence' && (run.workflow_id !== evidenceWorkflow.id || run.event !== 'workflow_dispatch')) {
                throw new Error('Upgrade evidence must come from the Graft production upgrade evidence workflow.');
              }
            }
      - name: Require the legacy publisher to be retired before cutover
        uses: actions/github-script@v8
        with:
          script: |
            const { data: legacy } = await github.rest.actions.getWorkflow({ owner: 'brentmwarner', repo: 'graft-studio', workflow_id: 'release.yml' });
            if (legacy.state === 'active') {
              throw new Error('Disable graft-studio/release.yml before promotion. The old production-branch publisher must not overwrite the new app feed.');
            }
            const pending = await Promise.all(['queued', 'in_progress', 'requested', 'waiting', 'pending'].map(status =>
              github.rest.actions.listWorkflowRuns({ owner: 'brentmwarner', repo: 'graft-studio', workflow_id: 'release.yml', status, per_page: 1 })
            ));
            if (pending.some(({ data }) => data.total_count > 0)) {
              throw new Error('An unfinished legacy release can still publish. Wait for or cancel it before promotion.');
            }
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: graft-upgrade-evidence
          path: release-evidence
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Bind native evidence to requested release source
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const evidence = JSON.parse(readFileSync("release-evidence/upgrade-evidence.json", "utf8"));
            if (evidence.version !== process.env.RELEASE_VERSION || evidence.sourceCommit !== process.env.SOURCE_COMMIT) throw new Error("Upgrade evidence belongs to another source/version");
          '
      - name: Verify all payloads before publication
        run: node scripts/publish-graft-release.ts --assets-dir release-assets --evidence release-evidence/upgrade-evidence.json
      - name: Upload immutable payloads, then promote existing stable feed
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/publish-graft-release.ts --assets-dir release-assets --evidence release-evidence/upgrade-evidence.json --publish
